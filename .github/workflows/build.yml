name: build

on:
  push:
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python: [ "3.10" ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install OS deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Install OS deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg exiftool

      - name: Install OS deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ffmpeg exiftool

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name "${{ env.APP_NAME }}" "${{ env.APP_ENTRY }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "${{ env.APP_NAME }}" "${{ env.APP_ENTRY }}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --name "${{ env.APP_NAME }}" "${{ env.APP_ENTRY }}"

      - name: Rename artifact (per OS)
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "dist/${{ env.APP_NAME }}.exe" "out/${{ env.APP_NAME }}-windows.exe"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp "dist/${{ env.APP_NAME }}" "out/${{ env.APP_NAME }}-macos"
          else
            cp "dist/${{ env.APP_NAME }}" "out/${{ env.APP_NAME }}-linux"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ runner.os }}
          path: out/*

  # Optional: attach builds to a GitHub Release when you create one
  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

env:
  APP_ENTRY: main-ui.py   # <-- change this to your real start script path
  APP_NAME: google-takeout-healer